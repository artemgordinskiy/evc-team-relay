name: Homelab release

# The homelab fork ships one artifact: the control-plane image with the fixes
# on this branch. Upstream's release.yml needs Docker Hub credentials and
# publishes all three images, so this branch removes it.
#
# Pushes and PRs to `homelab` run upstream's own control-plane checks. A tag
# vX.Y.Z.N (upstream release X.Y.Z plus fork revision N) runs the same
# checks, then builds one linux/amd64 image, pushes it to GHCR, attests it and
# publishes a GitHub release that names the image by digest. Deployments and
# the MCP fork's CI pin that digest, never the tag.

on:
  push:
    branches: [homelab]
    tags: ["v*.*.*.*"]
  pull_request:
    branches: [homelab]

permissions:
  contents: read

concurrency:
  group: homelab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks-control-plane.yml

  image:
    name: Control-plane image
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/control-plane
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/control-plane
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          # A plain image manifest, so the digest below is the one to pin;
          # provenance is attested separately.
          provenance: false
          sbom: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Check the pushed image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          resolved=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$resolved" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TAG resolves to $resolved, built $DIGEST"
            exit 1
          fi
          # The image must carry this branch's sync-write fix.
          docker run --rm --entrypoint grep "$IMAGE@$DIGEST" -q _sync_write_locked /app/app/api/routers/shares.py

      - name: Publish release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$IMAGE@$DIGEST" > control-plane.image
          {
            echo "Control plane only, linux/amd64. Pin the image by digest:"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          } > notes.md
          gh release create "$TAG" control-plane.image --verify-tag --title "$TAG" --notes-file notes.md
